_format_version: "3.0"
_transform: true

plugins:
  - name: cors
    config:
      origins:
        - "http://localhost:3000"
        - "http://127.0.0.1:3000"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
      exposed_headers:
        - Authorization
      credentials: true
      max_age: 3600

services:
  - name: user-auth-service
    url: http://user-auth-service:5001
    routes:
      - name: user-auth-route
        paths:
          - /auth
        strip_path: false

  - name: customer-service
    url: http://customer-service:5002
    routes:
      - name: customer-route
        paths:
          - /customers
        strip_path: false

  - name: inventory-service
    url: http://inventory-service:5003
    routes:
      - name: inventory-route
        paths:
          - /inventory
        strip_path: false

  - name: delivery-service
    url: http://delivery-service:5004
    routes:
      - name: delivery-route
        paths:
          - /deliveries
          - /tracking
          - /drivers
          - /optimize-route
        strip_path: false

  - name: order-service
    url: http://order-service:5005
    routes:
      - name: order-route
        paths:
          - /orders
          - /schedules
        strip_path: false
