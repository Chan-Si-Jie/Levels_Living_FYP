name: Backend Tests

on:
  push:
    branches: [ main, develop, Prototype-* ]
    paths:
      - 'CustomerMS/**'
      - 'DeliveryMS/**'
      - 'InventoryMS/**'
      - 'OrderMS/**'
      - 'UserMS/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'CustomerMS/**'
      - 'DeliveryMS/**'
      - 'InventoryMS/**'
      - 'OrderMS/**'
      - 'UserMS/**'
      - '.github/workflows/backend-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [CustomerMS, DeliveryMS, InventoryMS, OrderMS, UserMS]
        python-version: [3.9]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: levels_living_db_new
          MYSQL_USER: levels_user
          MYSQL_PASSWORD: levels_password
          MYSQL_ROOT_PASSWORD: levels_root_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      working-directory: ${{ matrix.service }}
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-mock pytest-flask requests-mock

    - name: Run tests with pytest
      working-directory: ${{ matrix.service }}
      env:
        DB_HOST: localhost
        DB_NAME: levels_living_db_new
        DB_USER: levels_user
        DB_PASSWORD: levels_password
        DB_PORT: 3306
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        JWT_SECRET_KEY: test-secret-key
        ENABLE_GEOCODING: false
      run: |
        pytest tests/ -v --cov=. --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ${{ matrix.service }}/coverage.xml
        flags: unittests
        name: ${{ matrix.service }}-coverage
        fail_ci_if_error: true